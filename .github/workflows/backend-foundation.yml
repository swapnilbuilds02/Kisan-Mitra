name: Backend foundation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: km_ci
          POSTGRES_DB: km_test_ci
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U km_ci -d km_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: psql -h localhost -U km_ci -d km_test_ci -c "COMMENT ON DATABASE km_test_ci IS 'KISAN_MITRA_DISPOSABLE_TEST_ONLY';"
        env:
          PGPASSWORD: "ci-${{ github.run_id }}"
      - run: python -m pytest backend/tests/test_postgres_identity_integration.py backend/tests/test_postgres_auth_integration.py backend/tests/test_postgres_farmer_integration.py backend/tests/test_postgres_password_integration.py backend/tests/test_postgres_recovery_integration.py backend/tests/test_postgres_onboarding_integration.py backend/tests/test_postgres_partner_integration.py backend/tests/test_postgres_admin_integration.py backend/tests/test_postgres_plot_integration.py -q
        env:
          KM_ALLOW_DISPOSABLE_DB_TESTS: "YES"
          KM_TEST_DATABASE_URL: "postgresql://km_ci:ci-${{ github.run_id }}@localhost:5432/km_test_ci"
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
  mobile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npx expo config --type public
        working-directory: mobile
